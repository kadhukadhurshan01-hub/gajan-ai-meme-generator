<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gajan AI Meme Generator</title>
<style>
body { background:#121212; color:white; font-family:Arial; text-align:center; padding:20px; }
input { padding:10px; width:80%; border-radius:8px; border:none; margin:10px; }
button { padding:10px 20px; background:#ff6b6b; color:white; border:none; border-radius:8px; cursor:pointer; }
#output { margin-top:20px; background:#1e1e1e; padding:15px; border-radius:10px; }
</style>
</head>
<body>
<h1>🔥 Gajan AI Meme Generator 🔥</h1>
<p>Tamil sentence ah kudunga, AI meme text create pannum</p>
<input id="input" placeholder="Example: Office work romba iruku">
<button onclick="generate()">Generate Meme</button>
<div id="output"></div>

<script>
function generate(){
  const text = document.getElementById('input').value;
  document.getElementById('output').innerHTML = `
  <h3>Top Text: "${text}-ah time-ku mudikkanum"</h3>
  <h3>Bottom Text: "Mudikkaama tea kudikkuren"</h3>
  <p>Template: Drake Hotline Bling Meme</p>
  `;
}
</script>
</body>
</html>
